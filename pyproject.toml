[project]
name = "earningslens"
version = "0.1.0"
description = "Grounded LLM extraction of KPIs and guidance from Indian bank earnings calls"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "pydantic>=2.5", "rapidfuzz>=3.5", "pdfplumber>=0.10", "python-dotenv>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
